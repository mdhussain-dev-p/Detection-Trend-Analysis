[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-topic-trends"
version = "0.1.0"
description = "Topic detection and research trend analysis in arXiv cs.LG abstracts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Project author" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = [
    "numpy",
    "pandas",
    "scikit-learn",
    "nltk",
    "gensim",
    "matplotlib",
]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
